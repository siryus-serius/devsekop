name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1" # pemindaian mingguan untuk CVE baru

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build, type check & unit test aplikasi
  # ---------------------------------------------------------------------------
  app:
    name: App — typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - name: Pastikan ABI yang di-commit sinkron dengan kontrak
        run: node scripts/export-abi.mjs && git diff --exit-code src/lib/chain/abi.ts
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  # ---------------------------------------------------------------------------
  # 2. Unit test smart contract
  # ---------------------------------------------------------------------------
  contracts:
    name: Contracts — test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx hardhat test

  # ---------------------------------------------------------------------------
  # 3. SAST smart contract — Slither
  # ---------------------------------------------------------------------------
  slither:
    name: SAST — Slither
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      # Kompilasi dilakukan di sini (sama seperti job Contracts), bukan di dalam container Slither,
      # agar instalasi dependensi tidak gagal. Slither cukup membaca hasil kompilasi Hardhat.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx hardhat compile
      - uses: crytic/slither-action@v0.4.1
        id: slither
        with:
          ignore-compile: true
          fail-on: medium
          sarif: results.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.slither.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
          category: slither

  # ---------------------------------------------------------------------------
  # 4. SAST aplikasi — Semgrep (OWASP Top 10, gagal bila ada temuan severity ERROR)
  # ---------------------------------------------------------------------------
  semgrep:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep scan
        run: >-
          semgrep scan
          --config p/default --config p/owasp-top-ten --config p/typescript
          --severity ERROR --error
          --sarif --output semgrep.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # ---------------------------------------------------------------------------
  # 5. SCA — kerentanan dependensi
  # ---------------------------------------------------------------------------
  sca:
    name: SCA — Dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: npm audit (dependensi produksi)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency review (PR)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ---------------------------------------------------------------------------
  # 6. Secret scanning
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan — Gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI resmi (checksum diverifikasi) memindai SELURUH riwayat git, aman juga setelah force push.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt
          grep "linux_x64.tar.gz" gitleaks_${GITLEAKS_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz gitleaks
      - name: Gitleaks scan (seluruh riwayat)
        run: ./gitleaks git . --redact --verbose --report-format sarif --report-path gitleaks.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('gitleaks.sarif') != ''
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  # ---------------------------------------------------------------------------
  # 7. Container — build image, scan Trivy, push ke registry HANYA bila lolos
  # ---------------------------------------------------------------------------
  container:
    name: Container — build & Trivy scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TRIVY_VERSION: 0.76.1
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGE:${{ github.sha }}" .
      - name: Install Trivy (checksum diverifikasi)
        run: |
          curl -sSfLO https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          curl -sSfLO https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz$" trivy_${TRIVY_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz trivy
      - name: Trivy — laporan lengkap (SARIF)
        run: ./trivy image --format sarif --output trivy.sarif "$IMAGE:${{ github.sha }}"
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy
      - name: Trivy — gate (gagal bila ada HIGH/CRITICAL yang sudah ada perbaikannya)
        run: ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE:${{ github.sha }}"
      - name: Push ke GitHub Container Registry (hanya main, setelah scan lolos)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ github.sha }}"

  # ---------------------------------------------------------------------------
  # 8. IaC — Checkov memeriksa Dockerfile & workflow GitHub Actions
  # ---------------------------------------------------------------------------
  iac:
    name: IaC — Checkov
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/devsecops.yml
      - run: pip install "checkov>=3,<4"
      - name: Checkov scan
        run: checkov -d . --framework dockerfile github_actions --output cli --output sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('checkov.sarif') != ''
        with:
          sarif_file: checkov.sarif
          category: checkov

  # ---------------------------------------------------------------------------
  # Gerbang keamanan: deployment hanya boleh berjalan bila semua pemeriksaan lolos
  # ---------------------------------------------------------------------------
  security-gate:
    name: Security gate
    runs-on: ubuntu-latest
    needs: [app, contracts, slither, semgrep, sca, secrets, container, iac]
    steps:
      - run: echo "Semua pemeriksaan keamanan lolos — siap untuk deployment."
